# Baseline experiment — frozen backbone, minimal augmentation
data_dir: ../data/raw/plantvillage
output_dir: weights
reports_dir: reports

model:
  model_name: tf_efficientnetv2_s
  pretrained: true

image:
  image_size: 224

training:
  epochs: 10
  batch_size: 16
  num_workers: 4

optimizer:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  scheduler: cosine

loss:
  loss: CrossEntropyLoss

augmentation:
  augmentation: minimal

stage:
  stage: baseline
  freeze_backbone: true

reproducibility:
  seed: 42

mixed_precision:
  use_amp: true

device:
  device: auto

bookkeeping:
  experiment_id: baseline_001
  experiment_name: Baseline frozen backbone, minimal augmentation